<!doctype html>
<html lang="en" id="mainBody">
<head>
	<meta charset="UTF-8">
	<title>Woomy Online</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Nabla&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	
	<link rel="icon" type="image/png" href="resources/favicon-66x66-k.png">
	<link rel="stylesheet" href="menu.css">

	<script src="js/extLib/peerjs.min.js"></script>
</head>

<body oncontextmenu="return false;" id="mainBody">

	<div id="loadingScreen" style="display:flex;position: absolute;z-index: 100000;background: black;color: white;width: 100%;height: 100%;justify-content: center;align-items: center;flex-direction: column;">
		<h1 id="loadingText" style="color:white;font-size:xxx-large;">Loading Files...</h1>
		<h5 style="color:white;">Made with love by Drako Hyena</h5>
	</div>

	<script>
		// THIS IS THE JAVASCRIPT INSIDE YOUR HTML
		let loadingMenu = document.getElementById("loadingScreen");
		let loadingText = document.getElementById("loadingText");
		
		// MANUALLY LISTING YOUR FILES (GitHub needs this!)
		const scripts = [
			"js/global.js",
			"js/util.js",
			"js/config.js",
			"js/colors.js",
			"js/assets.js",
			"js/drawing/canvas.js",
			"js/drawing/gameDraw.js",
			"js/drawing/drawEntity.js",
			"js/socket.js",
			"js/multiplayer.js",
			"js/app.js"
		];

		async function loadGame() {
			try {
				for (const src of scripts) {
					await new Promise((resolve, reject) => {
						const s = document.createElement('script');
						s.src = src; // Relative path works on GitHub!
						s.onload = resolve;
						s.onerror = () => reject("Failed to load: " + src);
						document.head.appendChild(s);
					});
				}
				console.log("Success!");
				loadingMenu.remove();
			} catch (e) {
				console.error(e);
				loadingText.innerHTML = "Error: " + e;
			}
		}
		loadGame();
	</script>

	<div id="gameAreaWrapper">
		<canvas id="gameCanvas" tabindex="1"></canvas>
	</div>

	<div id="mainWrapper">
		<div id="startMenuWrapper">
			<center>
				<img class="icon" src="resources/woomy-arras.io.png" alt="woomy" />
				<h1>Woomy Online</h1>
				<button id="startButton">Play</button>
			</center>
		</div>
	</div>

</body>
</html>
